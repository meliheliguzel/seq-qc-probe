name: CI Quality Gate

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Verify Code Formatting (Ruff)
        run: uv run ruff format --check .

      - name: Run Ruff Linter
        run: uv run ruff check .

      - name: Run Test Suite with Coverage (Pytest)
        run: uv run pytest --cov=seq_qc_probe --cov-report=term-missing --cov-fail-under=90

  docker-build:
    name: Multi-stage Docker Verification
    needs: lint-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: seq-qc-probe:ci-test

      - name: Verify CLI Help in Container
        run: |
          docker run --rm seq-qc-probe:ci-test --help
          docker run --rm seq-qc-probe:ci-test check --help

      - name: Smoke Test Validation on Real Fixture
        run: |
          docker run --rm -v "${{ github.workspace }}/tests/fixtures:/data:ro" seq-qc-probe:ci-test check --input /data/valid.fastq --min-q 28
