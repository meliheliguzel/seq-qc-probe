[project]
name = "seq-qc-probe"
version = "0.2.0"
description = "High-throughput, single-pass FASTQ, VCF, and SAM pre-flight quality control and structural integrity gate with zero runtime dependencies."
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [
    { name = "Melih Eliguzel" }
]
keywords = ["bioinformatics", "fastq", "vcf", "sam", "bam", "cigar", "ngs", "quality-control", "genomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Typing :: Typed",
]

dependencies = []

[project.urls]
Homepage = "https://github.com/meliheliguzel/seq-qc-probe"
Repository = "https://github.com/meliheliguzel/seq-qc-probe"
Issues = "https://github.com/meliheliguzel/seq-qc-probe/issues"
Changelog = "https://github.com/meliheliguzel/seq-qc-probe/blob/main/changelog.md"

[project.scripts]
seq-qc-probe = "seq_qc_probe.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/seq_qc_probe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["seq_qc_probe"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
